name: Diagnose hosting (one-off, manual)
# 6 Nov 2026: both live maps blank. Reads the live pages and lists the remote files with their sizes.
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Live pages as served
        run: |
          for u in storm_forecast_map.html storm_forecast_map_500km_test.html; do
            for k in 1 2 3; do   # plain URL (as visitors load it), three times in a row: MISS then HIT if edge-cached
              curl -sS -o "$u" -D "$u.hdr" --max-time 60 "https://plots.chennairains.com/$u" || true
              echo "== $u try $k: $(wc -c < "$u") bytes"; grep -iE "^(HTTP|cf-cache-status|last-modified|age|cache-control|expires):" "$u.hdr" || true
              sleep 3
            done
            echo "-- last 200 chars:"; tail -c 200 "$u"; echo
          done
      - name: CDN scripts the map needs
        run: |
          for u in https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js https://code.jquery.com/jquery-3.7.1.min.js https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js; do
            curl -sS -o /dev/null -w "%{http_code} %{size_download} B %{time_total}s  $u\n" --max-time 30 "$u" || echo "FAILED $u"
          done
      - name: Is the live page complete?
        run: |
          curl -sS -o live.html --max-time 60 "https://plots.chennairains.com/storm_forecast_map.html?nc=$RANDOM"
          echo "bytes: $(wc -c < live.html)"; echo "ends with </html>: $(tail -c 20 live.html | grep -c '</html>')"
          echo "map init present: $(grep -c 'L.map(' live.html)"; echo "view memory present: $(grep -c comk_map_view live.html)"; grep -o "Updated [^<]*" live.html | head -1; echo "-- last 300 chars:"; tail -c 300 live.html; echo
      - name: Remote file sizes
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          curl -sS --ssl-reqd --max-time 60 -u "$U:$P" "ftp://$H/${D#/}" | grep -E "storm_forecast|nowcast_bot|radar_loop|\.ftp-deploy" || true
          echo "-- quota (if the server reports it):"
          curl -sS --ssl-reqd --max-time 30 -u "$U:$P" "ftp://$H/" -Q "SITE QUOTA" 2>&1 | tail -3 || true
      - name: Largest files and folders in the upload folder
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          sudo apt-get -qq install -y lftp >/dev/null 2>&1 || true
          d="${D#./}"; d="${d%/}"
          lftp -e "set ftp:ssl-force true; set ssl:verify-certificate no; set net:timeout 60; set net:max-retries 2; cd /$d; du -m --max-depth=1 . | sort -rn | head -25; echo ---; cls -l --sort=size | head -20; bye" -u "$U,$P" "$H" 2>&1 | tail -50 || true
