name: fetch_sri (one-off)
on: workflow_dispatch
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir sri
          for r in kkl cni chn tvm mlr vsk mpt koc goa hyd sri mum; do
            for k in 0 1 2; do
              curl -s -m 40 -A "Mozilla/5.0" -o sri/sri_${r}_$k.gif -w "$r $k %{http_code} %{size_download}\n" https://mausam.imd.gov.in/Radar/sri_$r.gif || true
              [ "$r" = kkl ] || break
              sleep 300
            done
          done
          ls -la sri
      - uses: actions/upload-artifact@v4
        with: {name: sri, path: sri}
