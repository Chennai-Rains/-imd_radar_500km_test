name: fetch_sri (one-off)
on: workflow_dispatch
permissions: {contents: write}
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir sri && cd sri
          for r in kkl cni plk tvm mlr vsk mpt koc; do
            curl -s -m 40 -A "Mozilla/5.0" -o sri_$r.gif -w "$r %{http_code} %{size_download}\n" https://mausam.imd.gov.in/Radar/sri_$r.gif || true
          done
          git init -q -b sri-samples && git add . && git -c user.name=bot -c user.email=bot@x commit -qm "SRI samples $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sri-samples
