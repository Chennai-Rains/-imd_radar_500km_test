name: One-off 500km Karaikal test build

on:
  # Manual only -- this is a one-time (or occasional, re-run-as-needed)
  # preview build, not a recurring job. No schedule, no external pinger.
  workflow_dispatch: {}

# Deliberately NOT `permissions: contents: write` and NOT committing
# anything back to the repo -- this is a throwaway preview build. Its own
# archive/state live in isolated test-only directories (see
# test_500km_pipeline.py) that are never persisted between runs; each
# dispatch starts from a clean slate and re-fetches fresh frames. The only
# side effect outside this job's own throwaway runner is the single
# uploaded HTML file.
jobs:
  build-test-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract OCR (system package -- pytesseract just wraps this binary)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run one-off test pipeline (Karaikal on kkl_ppz/500km, NIOT + Kochi unchanged)
        run: python test_500km_pipeline.py

      - name: Upload test map to a NEW file (does not touch the live storm_forecast_map.html)
        # IMPORTANT: this deploys into the SAME remote folder the live
        # IMD_Radar_Updates repo deploys storm_forecast_map.html into.
        # FTP-Deploy-Action tracks what it's deployed via a small state
        # file it stores IN that same remote folder
        # (.ftp-deploy-sync-state.json by default) -- and it treats any
        # file listed in that state but missing from this run's local-dir
        # as something to DELETE from the server. Without a state-name of
        # its own, this workflow would download the LIVE repo's state
        # file (same default name, same folder), see storm_forecast_map
        # .html listed in it, not have that file locally (this only ever
        # builds storm_forecast_map_500km_test.html), and delete the live
        # file -- which is exactly what happened the first time this ran:
        # every dispatch of this workflow took the live map down until
        # production's next cycle re-uploaded it.
        #
        # A distinct state-name keeps this workflow's own tracked-file
        # list completely separate from the live repo's, so it only ever
        # reasons about (and can only ever delete) files IT has uploaded.
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./output/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          state-name: .ftp-deploy-sync-state-500km-test.json
          # Never delete anything already sitting in that remote folder --
          # this only ever adds/overwrites storm_forecast_map_500km_test.html.
          dangerous-clean-slate: false
