name: 500km Karaikal test build

on:
  # Same pattern as the live repo's nowcast.yml: an external cron-job.org
  # pinger calls this workflow's workflow_dispatch API endpoint every
  # 15 minutes (see README for setup). workflow_dispatch also lets you
  # trigger a run manually from the Actions tab any time.
  workflow_dispatch:
    inputs:
      send_test_draft:
        description: "Also send one made-up test draft to Telegram (checks the link, no real weather)"
        type: boolean
        default: false
      send_test_x:
        description: "Post ONE harmless test tweet (with an image) to the X account, to check the keys. Public if the account is public."
        type: boolean
        default: false
      send_test_facebook:
        description: "Check the Facebook Page secrets: uploads an UNPUBLISHED test photo and deletes it. Nothing appears on the Page."
        type: boolean
        default: false
      send_alert_now:
        description: "Manual trigger: post the rain spells active right now, ignoring quiet hours (11 PM-4 AM), gaps and 'already alerted'"
        type: boolean
        default: false

# Only one run at a time, same reasoning as the live repo: cheap insurance
# against two runs racing to commit/push state_500km_test/archive_500km_test
# at once if a run ever takes longer than expected.
concurrency:
  group: nowcast-500km-test-pipeline
  cancel-in-progress: false

permissions:
  contents: write  # needed so the workflow can commit updated state_500km_test/ and archive_500km_test/ back to the repo

jobs:
  build-test-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Explicit `main`, not the default -- see the live repo's
          # nowcast.yml for why (workflow_dispatch's default ref resolves
          # to main's tip at DISPATCH time, not execution time, which
          # matters once runs can queue behind each other).
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 12 Nov 2026: on 11 Nov, 7:55-10:10 PM IST, every run failed here -- the runners could not resolve the Ubuntu
      # package mirror ("Temporary failure resolving azure.archive.ubuntu.com"), apt hung ~8 min, and the run died
      # before making a map. The .deb files are now kept in the Actions cache and installed straight from it, so a
      # mirror outage no longer matters; apt (with short timeouts) is only the fallback when the cache is empty/stale.
      - name: Restore cached Tesseract packages
        id: tess_cache
        uses: actions/cache@v4
        with:
          path: ~/tess-debs
          key: tesseract-debs-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install Tesseract OCR (system package -- pytesseract just wraps this binary)
        timeout-minutes: 5
        run: |
          if ls ~/tess-debs/*.deb >/dev/null 2>&1 && sudo dpkg -i ~/tess-debs/*.deb >/dev/null && tesseract --version >/dev/null 2>&1; then
            echo "Tesseract installed from the cached packages"; exit 0
          fi
          echo "No usable cached packages -- installing from the Ubuntu mirror"
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $APT update -qq || true
          sudo rm -f /var/cache/apt/archives/*.deb
          sudo apt-get $APT install -y tesseract-ocr
          rm -rf ~/tess-debs && mkdir -p ~/tess-debs && cp /var/cache/apt/archives/*.deb ~/tess-debs/
          ls ~/tess-debs

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # 13 Nov 2026: Meteosat IODC satellite masks for the radar-health check (nowcast_bot._satellite_radar_check).
      # Runs in the background so a slow EUMETSAT server never delays the map; whatever it saves is used by the
      # NEXT runs (state_social_test/sat/), and a missed fetch just means the check uses the last file (<= 90 min).
      - name: Start the satellite fetch (background)
        run: nohup python fetch_satellite.py > sat_fetch.log 2>&1 &

      - name: Run one-off test pipeline (Karaikal on kkl_ppz/500km, NIOT + Kochi unchanged)
        # Telegram secrets feed the SHADOW-MODE alert drafts (social_alerts.py,
        # called at the end of test_500km_pipeline.py): a private review chat,
        # nothing public. Unset -> the draft is only printed in the log.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # public posting (X + Facebook Page): a dry run unless PUBLIC_POST_ENABLED is the text 'true' (repository variable)
          PUBLIC_POST_ENABLED: ${{ vars.PUBLIC_POST_ENABLED || secrets.PUBLIC_POST_ENABLED }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          SOCIAL_TEST_DRAFT: ${{ inputs.send_test_draft }}
          SOCIAL_FORCE_ALERT: ${{ inputs.send_alert_now }}
          SOCIAL_TEST_X: ${{ inputs.send_test_x }}
          SOCIAL_TEST_FB: ${{ inputs.send_test_facebook }}
        run: python test_500km_pipeline.py

      - name: Rebase onto latest main before committing
        # Same reasoning as the live repo's nowcast.yml -- see that file's
        # comment on this step for the full story (a manual push landing
        # mid-run, or another run's state commit, shouldn't cost this
        # run's upload).
        run: |
          git fetch origin main
          if ! git rebase origin/main --autostash; then
            echo "Rebase failed/conflicted -- aborting to a clean state so the commit+upload steps still run this cycle."
            git rebase --abort || true
            git stash pop || true
          fi
        continue-on-error: true

      - name: Satellite fetch log
        if: ${{ !cancelled() }}
        run: cat sat_fetch.log 2>/dev/null || echo "no satellite log"

      - name: Commit updated tracking state + frame archive
        # Needed for direction arrows: track_cells() compares this run's
        # cells against the PREVIOUS run's (state_500km_test/prev_cells.json)
        # to compute velocity_kmh -- and for the alerts: state_social_test/
        # holds when the last post went out, so the next run respects the
        # posting gaps.
        # 4 Nov 2026: was stefanzweifel/git-auto-commit-action, which tries the push once. At 3:06 PM IST GitHub
        # answered "remote: fatal error in commit_refs", the push was lost (continue-on-error), and the 3:16 PM
        # run -- not knowing about the 3:06 post -- posted again 10 minutes later. Now the push is retried up to
        # 6 times, re-syncing with main in between; this run's own state wins any clash.
        continue-on-error: true
        run: |
          git config user.name "nowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A state_500km_test/ archive_500km_test/ state_social_test/
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -q -m "Update 500km test tracking state"
          for i in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push attempt $i failed; re-syncing with main and retrying."
            sleep $((i * 5))
            git fetch origin main
            if ! git rebase -X theirs origin/main; then git rebase --abort || true; fi
          done
          echo "::error::State push failed after 6 attempts -- the next run will not know about this run's post."
          exit 1

      - name: Publish this map as the live map too
        # 6 Nov 2026 (Srikanth): one pipeline instead of two, to cut the uploads to a struggling host. This repo
        # now also writes the LIVE storm_forecast_map.html (all its radars and the radar menu); the production repo
        # (Chennai-Rains/IMD_Radar_Updates) is switched off and kept as a fallback.
        if: ${{ !cancelled() && hashFiles('output/**') != '' }}   # nothing to upload if the pipeline never ran
        run: |
          # 6 Nov 2026: uploads take minutes on the slow host and FTP overwrites the live file IN PLACE, so a visitor
          # (and Cloudflare's cache) could get a half-written page -- banner and legend but no map. The page now goes
          # up as storm_forecast_map.next.html and is renamed over the live file only once complete (step below).
          # The _500km_test address becomes a small permanent redirect to the live map.
          [ -f output/storm_forecast_map_500km_test.html ] && mv output/storm_forecast_map_500km_test.html output/storm_forecast_map.next.html
          rm -f output/storm_forecast_map.html
          cat > output/storm_forecast_map_500km_test.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=storm_forecast_map.html"><link rel="canonical" href="storm_forecast_map.html"><title>Radar nowcast</title></head><body><a href="storm_forecast_map.html">Radar nowcast map</a></body></html>
          HTML
          ls -la output/

      - name: Upload the maps (live storm_forecast_map.html + the _500km_test copy) and the bot files
        # IMPORTANT: this deploys into the SAME remote folder the live
        # IMD_Radar_Updates repo deploys storm_forecast_map.html into.
        # FTP-Deploy-Action tracks what it's deployed via a small state
        # file it stores IN that same remote folder
        # (.ftp-deploy-sync-state.json by default) -- and it treats any
        # file listed in that state but missing from this run's local-dir
        # as something to DELETE from the server. A distinct state-name
        # keeps this workflow's own tracked-file list completely separate
        # from the live repo's, so it only ever reasons about (and can
        # only ever delete) files IT has uploaded. See git history for
        # what happened the one time this wasn't set.
        id: upload1
        continue-on-error: true
        if: ${{ !cancelled() && hashFiles('output/**') != '' }}   # nothing to upload if the pipeline never ran
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./output/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          state-name: .ftp-deploy-sync-state-500km-test.json
          # Never delete anything already sitting in that remote folder --
          # this only ever adds/overwrites storm_forecast_map_500km_test.html.
          dangerous-clean-slate: false
          timeout: 120000   # 6 Nov 2026: the host often takes > 30 s (the default) to answer; uploads died at exactly 30 s

      - name: Wait before retrying the upload
        # 6 Nov 2026: test uploads kept timing out ~30 s in ("Timeout (control/data socket)") while production's,
        # started on the same 5-min tick, succeeded -- most likely the host's limit on simultaneous FTP sessions
        # for one account. On a failure, wait for production's upload to finish and try once more.
        if: ${{ !cancelled() && steps.upload1.outcome == 'failure' }}
        run: sleep 75

      - name: Retry the test map upload
        # IMPORTANT: this deploys into the SAME remote folder the live
        # IMD_Radar_Updates repo deploys storm_forecast_map.html into.
        # FTP-Deploy-Action tracks what it's deployed via a small state
        # file it stores IN that same remote folder
        # (.ftp-deploy-sync-state.json by default) -- and it treats any
        # file listed in that state but missing from this run's local-dir
        # as something to DELETE from the server. A distinct state-name
        # keeps this workflow's own tracked-file list completely separate
        # from the live repo's, so it only ever reasons about (and can
        # only ever delete) files IT has uploaded. See git history for
        # what happened the one time this wasn't set.
        id: upload2
        if: ${{ !cancelled() && steps.upload1.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./output/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          state-name: .ftp-deploy-sync-state-500km-test.json
          # Never delete anything already sitting in that remote folder --
          # this only ever adds/overwrites storm_forecast_map_500km_test.html.
          dangerous-clean-slate: false
          timeout: 120000   # 6 Nov 2026: the host often takes > 30 s (the default) to answer; uploads died at exactly 30 s

      - name: Swap the new page in (rename over the live file)
        if: ${{ !cancelled() && (steps.upload1.outcome == 'success' || steps.upload2.outcome == 'success') }}
        continue-on-error: true
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          d="${D#./}"; d="${d#/}"; d="${d%/}"; [ -n "$d" ] && d="/$d"
          # -k: the host's FTPS certificate does not name it (FTP-Deploy-Action's default "loose" mode accepts the same)
          ftp() { curl -sS --ssl-reqd -k --max-time 120 -u "$U:$P" "ftp://$H$d/" -o /dev/null "$@"; }
          if ftp -Q "RNFR $d/storm_forecast_map.next.html" -Q "RNTO $d/storm_forecast_map.html"; then
            echo "Live map swapped in."
          else
            echo "Rename over the existing file refused; deleting then renaming."
            ftp -Q "DELE $d/storm_forecast_map.html" -Q "RNFR $d/storm_forecast_map.next.html" -Q "RNTO $d/storm_forecast_map.html" && echo "Live map swapped in (delete + rename)."
          fi
