name: 500km Karaikal test build

on:
  # Same pattern as the live repo's nowcast.yml: an external cron-job.org
  # pinger calls this workflow's workflow_dispatch API endpoint every
  # 15 minutes (see README for setup). workflow_dispatch also lets you
  # trigger a run manually from the Actions tab any time.
  workflow_dispatch:
    inputs:
      send_test_draft:
        description: "Also send one made-up test draft to Telegram (checks the link, no real weather)"
        type: boolean
        default: false
      send_test_x:
        description: "Post ONE harmless test tweet (with an image) to the X account, to check the keys. Public if the account is public."
        type: boolean
        default: false
      send_test_facebook:
        description: "Check the Facebook Page secrets: uploads an UNPUBLISHED test photo and deletes it. Nothing appears on the Page."
        type: boolean
        default: false
      send_alert_now:
        description: "Manual trigger: post the rain spells active right now, ignoring quiet hours (11 PM-4 AM), gaps and 'already alerted'"
        type: boolean
        default: false

# Only one run at a time, same reasoning as the live repo: cheap insurance
# against two runs racing to commit/push state_500km_test/archive_500km_test
# at once if a run ever takes longer than expected.
concurrency:
  group: nowcast-500km-test-pipeline
  cancel-in-progress: false

permissions:
  contents: write  # needed so the workflow can commit updated state_500km_test/ and archive_500km_test/ back to the repo

jobs:
  build-test-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Explicit `main`, not the default -- see the live repo's
          # nowcast.yml for why (workflow_dispatch's default ref resolves
          # to main's tip at DISPATCH time, not execution time, which
          # matters once runs can queue behind each other).
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract OCR (system package -- pytesseract just wraps this binary)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run one-off test pipeline (Karaikal on kkl_ppz/500km, NIOT + Kochi unchanged)
        # Telegram secrets feed the SHADOW-MODE alert drafts (social_alerts.py,
        # called at the end of test_500km_pipeline.py): a private review chat,
        # nothing public. Unset -> the draft is only printed in the log.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # public posting (X + Facebook Page): a dry run unless PUBLIC_POST_ENABLED is the text 'true' (repository variable)
          PUBLIC_POST_ENABLED: ${{ vars.PUBLIC_POST_ENABLED || secrets.PUBLIC_POST_ENABLED }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          SOCIAL_TEST_DRAFT: ${{ inputs.send_test_draft }}
          SOCIAL_FORCE_ALERT: ${{ inputs.send_alert_now }}
          SOCIAL_TEST_X: ${{ inputs.send_test_x }}
          SOCIAL_TEST_FB: ${{ inputs.send_test_facebook }}
        run: python test_500km_pipeline.py

      - name: Rebase onto latest main before committing
        # Same reasoning as the live repo's nowcast.yml -- see that file's
        # comment on this step for the full story (a manual push landing
        # mid-run, or another run's state commit, shouldn't cost this
        # run's upload).
        run: |
          git fetch origin main
          if ! git rebase origin/main --autostash; then
            echo "Rebase failed/conflicted -- aborting to a clean state so the commit+upload steps still run this cycle."
            git rebase --abort || true
            git stash pop || true
          fi
        continue-on-error: true

      - name: Commit updated tracking state + frame archive
        # Needed for direction arrows: track_cells() compares this run's
        # cells against the PREVIOUS run's (state_500km_test/prev_cells.json)
        # to compute velocity_kmh -- and for the alerts: state_social_test/
        # holds when the last post went out, so the next run respects the
        # posting gaps.
        # 4 Nov 2026: was stefanzweifel/git-auto-commit-action, which tries the push once. At 3:06 PM IST GitHub
        # answered "remote: fatal error in commit_refs", the push was lost (continue-on-error), and the 3:16 PM
        # run -- not knowing about the 3:06 post -- posted again 10 minutes later. Now the push is retried up to
        # 6 times, re-syncing with main in between; this run's own state wins any clash.
        continue-on-error: true
        run: |
          git config user.name "nowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A state_500km_test/ archive_500km_test/ state_social_test/
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -q -m "Update 500km test tracking state"
          for i in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push attempt $i failed; re-syncing with main and retrying."
            sleep $((i * 5))
            git fetch origin main
            if ! git rebase -X theirs origin/main; then git rebase --abort || true; fi
          done
          echo "::error::State push failed after 6 attempts -- the next run will not know about this run's post."
          exit 1

      - name: Upload test map to a NEW file (does not touch the live storm_forecast_map.html)
        # IMPORTANT: this deploys into the SAME remote folder the live
        # IMD_Radar_Updates repo deploys storm_forecast_map.html into.
        # FTP-Deploy-Action tracks what it's deployed via a small state
        # file it stores IN that same remote folder
        # (.ftp-deploy-sync-state.json by default) -- and it treats any
        # file listed in that state but missing from this run's local-dir
        # as something to DELETE from the server. A distinct state-name
        # keeps this workflow's own tracked-file list completely separate
        # from the live repo's, so it only ever reasons about (and can
        # only ever delete) files IT has uploaded. See git history for
        # what happened the one time this wasn't set.
        id: upload1
        continue-on-error: true
        if: ${{ !cancelled() }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./output/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          state-name: .ftp-deploy-sync-state-500km-test.json
          # Never delete anything already sitting in that remote folder --
          # this only ever adds/overwrites storm_forecast_map_500km_test.html.
          dangerous-clean-slate: false

      - name: Wait before retrying the upload
        # 6 Nov 2026: test uploads kept timing out ~30 s in ("Timeout (control/data socket)") while production's,
        # started on the same 5-min tick, succeeded -- most likely the host's limit on simultaneous FTP sessions
        # for one account. On a failure, wait for production's upload to finish and try once more.
        if: ${{ !cancelled() && steps.upload1.outcome == 'failure' }}
        run: sleep 75

      - name: Retry the test map upload
        # IMPORTANT: this deploys into the SAME remote folder the live
        # IMD_Radar_Updates repo deploys storm_forecast_map.html into.
        # FTP-Deploy-Action tracks what it's deployed via a small state
        # file it stores IN that same remote folder
        # (.ftp-deploy-sync-state.json by default) -- and it treats any
        # file listed in that state but missing from this run's local-dir
        # as something to DELETE from the server. A distinct state-name
        # keeps this workflow's own tracked-file list completely separate
        # from the live repo's, so it only ever reasons about (and can
        # only ever delete) files IT has uploaded. See git history for
        # what happened the one time this wasn't set.
        if: ${{ !cancelled() && steps.upload1.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./output/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          state-name: .ftp-deploy-sync-state-500km-test.json
          # Never delete anything already sitting in that remote folder --
          # this only ever adds/overwrites storm_forecast_map_500km_test.html.
          dangerous-clean-slate: false
