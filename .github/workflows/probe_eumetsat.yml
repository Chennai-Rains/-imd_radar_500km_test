name: probe_eumetsat (one-off)
on: workflow_dispatch
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          W=https://view.eumetsat.int/geoserver/wms
          curl -s -m 120 -o caps.xml "$W?service=WMS&version=1.3.0&request=GetCapabilities" -w "caps %{http_code} %{size_download}\n"
          python3 - <<'P'
          import re
          x=open('caps.xml',encoding='utf-8',errors='ignore').read()
          names=re.findall(r'<Layer[^>]*>\s*<Name>([^<]+)</Name>\s*<Title>([^<]*)</Title>',x)
          sel=[(n,t) for n,t in names if 'iodc' in n.lower() or 'iodc' in t.lower() or 'Indian' in t]
          open('iodc_layers.txt','w').write("\n".join(f"{n}\t{t}" for n,t in sel))
          print(len(names),"layers,",len(sel),"IODC")
          # time extent of a few
          for n,t in sel:
              i=x.find('<Name>'+n+'</Name>'); m=re.search(r'<Dimension name="time"[^>]*>([^<]{0,300})',x[i:i+6000])
              if m: open('iodc_layers.txt','a').write(f"\n## {n} time: ...{m.group(1)[-120:]}")
          P
          for L in $(cut -f1 iodc_layers.txt | grep -v '^##' | grep -iE "ir108|clm|cloud|mpe|precip|ir_108|cth|ctt" | head -8); do
            f=$(echo $L | tr ':' '_')
            curl -s -m 90 -o $f.png "$W?service=WMS&version=1.3.0&request=GetMap&layers=$L&styles=&crs=EPSG:4326&bbox=8,76,14.5,81.5&width=550&height=650&format=image/png" -w "$L %{http_code} %{content_type} %{size_download}\n"
          done
          ls -la
          git init -q -b eumetsat-probe && git add . && git -c user.name=bot -c user.email=bot@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" eumetsat-probe
