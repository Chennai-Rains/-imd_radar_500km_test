name: probe_eumetsat (one-off)
on: workflow_dispatch
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          W=https://view.eumetsat.int/geoserver/wms
          curl -s -m 120 -o caps.xml "$W?service=WMS&version=1.3.0&request=GetCapabilities" -w "caps %{http_code} %{size_download}\n"
          python3 - <<'P'
          import re
          x=open('caps.xml',encoding='utf-8',errors='ignore').read()
          names=re.findall(r'<Layer[^>]*>\s*<Name>([^<]+)</Name>\s*<Title>([^<]*)</Title>',x)
          sel=[(n,t) for n,t in names if 'iodc' in n.lower() or 'iodc' in t.lower() or 'Indian' in t]
          open('iodc_layers.txt','w').write("\n".join(f"{n}\t{t}" for n,t in sel))
          print(len(names),"layers,",len(sel),"IODC")
          # time extent of a few
          for n,t in sel:
              i=x.find('<Name>'+n+'</Name>'); m=re.search(r'<Dimension name="time"[^>]*>([^<]{0,300})',x[i:i+6000])
              if m: open('iodc_layers.txt','a').write(f"\n## {n} time: ...{m.group(1)[-120:]}")
          P
          for L in msg_iodc:cth msg_iodc:h63 msg_iodc:ir108 msg_iodc:clm; do
            f=$(echo $L | tr ':' '_')
            curl -s -m 120 -o ${f}_legend.png "$W?service=WMS&version=1.3.0&request=GetLegendGraphic&layer=$L&format=image/png" -w "legend $L %{http_code} %{size_download}\n"
            for T in 2026-11-12T22:30:00Z 2026-11-12T23:00:00Z 2026-11-12T10:30:00Z; do
              curl -s -m 150 -o ${f}_$T.png "$W?service=WMS&version=1.3.0&request=GetMap&layers=$L&styles=&crs=EPSG:4326&bbox=8,76,14.5,81.5&width=550&height=650&format=image/png&time=$T" -w "$L $T %{http_code} %{content_type} %{size_download} %{time_total}s\n"
            done
          done
          python3 - <<'P'
          import re
          x=open('caps.xml',encoding='utf-8',errors='ignore').read()
          for n in ('msg_iodc:cth','msg_iodc:h63','msg_iodc:ir108'):
              i=x.find('<Name>'+n+'</Name>'); seg=x[i:i+5000]
              open('styles.txt','a').write(n+"\n"+"\n".join(re.findall(r'<Style>.*?</Style>',seg,re.S))[:1500]+"\n\n")
          P
          ls -la
          git init -q -b eumetsat-probe && git add . && git -c user.name=bot -c user.email=bot@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" eumetsat-probe
